# Copy to the root of the private deployment bundle as render.yaml.
services:
  - type: web
    name: creature-family-encounter
    runtime: docker
    plan: starter
    dockerfilePath: ./scripts/family_encounter/Dockerfile
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: family-access-state
      mountPath: /var/lib/creature
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FAMILY_PASSWORD_HASH
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
